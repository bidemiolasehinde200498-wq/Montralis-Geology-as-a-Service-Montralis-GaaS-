<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Montralis Client Portal</title>
  </head>
  <body class="bg-slate-950 text-white">
    <div id="root">
      <main style="min-height:100vh;display:grid;place-content:center;gap:8px;padding:24px;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif">
        <h1 style="margin:0;font-size:20px">Montralis Client Portal</h1>
        <p style="margin:0;color:#94a3b8">Starting portal…</p>
      </main>
    </div>
    <script>
      window.addEventListener('error', (event) => {
        const root = document.getElementById('root');
        if (!root) return;
        const panel = document.createElement('main');
        panel.style.cssText = 'min-height:100vh;display:grid;align-content:center;gap:12px;padding:24px;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif';
        const heading = document.createElement('h1');
        heading.textContent = 'Client portal failed to load';
        const details = document.createElement('pre');
        details.style.cssText = 'max-width:800px;white-space:pre-wrap;color:#fda4af';
        details.textContent = event.error?.stack || event.message || 'Unknown browser error';
        panel.append(heading, details);
        root.replaceChildren(panel);
      });
      window.addEventListener('unhandledrejection', (event) => {
        window.dispatchEvent(new ErrorEvent('error', { error: event.reason, message: event.reason?.message }));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
